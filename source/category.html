<!DOCTYPE html>
<html lang="sk" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warhammer Test</title>
    <script type="module" src="/src/js/main.js"></script>
</head>

<body class="bg-wh-dark text-white p-10 flex flex-col items-center gap-6">

    <h1 class="text-3xl font-bold text-wh-red tracking-wider">
        WARHAMMER E-SHOP TEST
    </h1>

    <!-- Перевірка Alpine.js та Notyf -->
    <div x-data="{ count: 0 }" class="bg-wh-card p-6 rounded-lg border border-red-900/40 text-center shadow-xl">
        <p class="mb-4 text-gray-300">Кількість у кошику: <span x-text="count" class="font-bold text-white">0</span></p>
        <button @click="count++; notyf.success('Товар додано!')"
            class="bg-wh-red hover:bg-red-700 text-white font-bold py-2 px-4 rounded transition">
            Додати в кошик
        </button>
    </div>

</body>

</html>
